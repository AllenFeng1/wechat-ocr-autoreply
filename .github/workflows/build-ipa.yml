name: build-ipa

# 只支持手动触发（Actions 页面 Run workflow）：
# 免费 Apple ID 必须勾选 free_account=true，用无 App Group 配置生成工程；
# push 自动触发无法选择账号类型，默认配置产出的 IPA 免费账号用不了，
# 因此不监听 push，每次构建都是显式的。
on:
  workflow_dispatch:
    inputs:
      free_account:
        description: "使用免费 Apple ID 配置（无 App Group，扩展用默认配置）"
        type: boolean
        default: false

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: |
          # 免费账号：用无 App Group 的 spec 覆盖默认 spec。
          # 注意：不要用 xcodegen -p/-s 传 spec 路径（不同版本参数行为不一致），
          # 直接 cp 覆盖 project.yml 后走标准 generate 最稳。
          if [ "${{ inputs.free_account }}" = "true" ]; then
            cp project.freeaccount.yml project.yml
          fi
          xcodegen generate

      - name: Build archive (unsigned)
        working-directory: ios
        run: |
          set -euo pipefail
          xcodebuild \
            -project WeChatOCRAutoReply.xcodeproj \
            -scheme WeChatOCRAutoReply \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/WeChatOCRAutoReply.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Package unsigned IPA
        working-directory: ios
        run: |
          set -euo pipefail
          rm -rf Payload build/Payload
          mkdir -p Payload
          cp -R build/WeChatOCRAutoReply.xcarchive/Products/Applications/WeChatOCRAutoReply.app Payload/
          zip -qry WeChatOCRAutoReply-unsigned.ipa Payload
          rm -rf Payload
          ls -lh WeChatOCRAutoReply-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: WeChatOCRAutoReply-unsigned-ipa
          path: ios/WeChatOCRAutoReply-unsigned.ipa
          if-no-files-found: error
